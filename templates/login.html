{% extends "layout.html" %}

{% block content %}
<div style="max-width: 450px; width: 100%; margin: 5rem auto; padding: 0 1rem; box-sizing: border-box;">
    <div class="glass-card">
        <h2 style="text-align: center; margin-bottom: 0.5rem; font-family: 'Playfair Display', serif; color: var(--dark);"
            data-i18n="login_title">
            Welcome Back</h2>
        <p style="text-align: center; margin-bottom: 2rem; color: var(--text-dark); font-size: 0.9rem;"
            data-i18n="login_subtitle">Sign in to
            access your dashboard</p>
        <form id="loginForm" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--dark);"
                    data-i18n="email">Username,
                    Email or Mobile</label>
                <input type="text" name="username" required placeholder="Enter your username"
                    data-i18n="search_patients">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--dark);"
                    data-i18n="password">Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="login">Sign In</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dark);">
            <span data-i18n="no_account">Don't have an account?</span> <a href="{{ url_for('auth.register') }}"
                style="color: var(--primary); font-weight: 600; text-decoration: none;" data-i18n="sign_up">Register
                here</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        try {
            const res = await fetch("{{ url_for('auth.login') }}", {
                method: "POST",
                headers: { "Accept": "application/json" },
                body: formData
            });

            const data = await res.json();
            if (res.ok) {
                showSuccess("Login Confirmed!", data.redirect);
            } else {
                if (data.redirect) {
                    showSuccess(data.error || "Redirecting...", data.redirect);
                } else {
                    alert(data.error || "Login failed");
                }
            }
        } catch (err) {
            console.error(err);
        }
    };
</script>
{% endblock %}

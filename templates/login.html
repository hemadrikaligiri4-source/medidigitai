{% extends "layout.html" %}

{% block content %}
<div style="max-width: 450px; width: 100%; margin: 5rem auto; padding: 0 1rem; box-sizing: border-box;">
    <div class="glass-card">
        <h2 style="text-align: center; margin-bottom: 0.5rem; font-family: 'Playfair Display', serif; color: var(--dark);"
            data-i18n="login_title">
            Welcome Back</h2>
        <p style="text-align: center; margin-bottom: 2rem; color: var(--text-dark); font-size: 0.9rem;"
            data-i18n="login_subtitle">Sign in to
            access your dashboard</p>
        <form id="loginForm" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--dark);"
                    data-i18n="email">Username,
                    Email or Mobile</label>
                <input type="text" name="username" required placeholder="Enter your username"
                    data-i18n="search_patients">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--dark);"
                    data-i18n="password">Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="login">Sign In</button>
        </form>
        
        <!-- Additive: Auth0 Login Button -->
        <div style="text-align: center; margin: 1.5rem 0; position: relative;">
            <hr style="border: none; border-top: 1px solid var(--border);">
            <span style="position: absolute; top: -0.7rem; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 1rem; color: var(--text-dark); font-size: 0.9rem;">or</span>
        </div>
        <a href="{{ url_for('auth.auth0_login') }}" class="btn" style="width: 100%; background: #fff; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none;">
            <svg viewBox="0 0 32 32" width="20" height="20">
                <path fill="#eb5424" d="M16 0.031c-8.834 0-16 7.166-16 16s7.166 16 16 16 16-7.166 16-16-7.166-16-16-16zM24.896 22.427l-5.698-8.172h-6.396l-5.703 8.172c-1.391-1.745-2.224-3.953-2.224-6.365 0-5.615 4.547-10.161 10.161-10.161s10.161 4.547 10.161 10.161c0 2.411-0.833 4.62-2.302 6.365z"></path>
            </svg>
            Sign in with Auth0
        </a>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dark);">
            <span data-i18n="no_account">Don't have an account?</span> <a href="{{ url_for('auth.register') }}"
                style="color: var(--primary); font-weight: 600; text-decoration: none;" data-i18n="sign_up">Register
                here</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        try {
            const res = await fetch("{{ url_for('auth.login') }}", {
                method: "POST",
                headers: { "Accept": "application/json" },
                body: formData
            });

            const data = await res.json();
            if (res.ok) {
                showSuccess("Login Confirmed!", data.redirect);
            } else {
                if (data.redirect) {
                    showSuccess(data.error || "Redirecting...", data.redirect);
                } else {
                    alert(data.error || "Login failed");
                }
            }
        } catch (err) {
            console.error(err);
        }
    };
</script>
{% endblock %}
